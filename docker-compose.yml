version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: algoforge_postgres
    environment:
      POSTGRES_USER: algoforge
      POSTGRES_PASSWORD: algoforge_password
      POSTGRES_DB: algoforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - algoforge_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algoforge -d algoforge_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algoforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - algoforge_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algoforge_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/algoforge_db
      - SPRING_DATASOURCE_USERNAME=algoforge
      - SPRING_DATASOURCE_PASSWORD=algoforge_password
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - algoforge_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algoforge_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - algoforge_network

volumes:
  postgres_data:
  redis_data:

networks:
  algoforge_network:
    driver: bridge
